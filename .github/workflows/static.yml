# Deploys the static site to GitHub Pages.
# Hardened: actions pinned to full commit SHAs (Dependabot keeps them current), least-privilege
# token per job, no credentials left on disk, a security check before every deploy, and only an
# allowlist of public files is published (no repo config, dotfiles or tooling).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do NOT cancel in-progress runs so production deployments always complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security check
        run: bash .github/scripts/check-site.sh

      - name: Assemble the public site (allowlist)
        run: |
          mkdir _site
          cp -R ./*.html assets .well-known favicon.ico robots.txt sitemap.xml site.webmanifest _site/
          find _site -name '.DS_Store' -delete
          echo "Publishing:"; find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # needed for .well-known/security.txt; _site only holds the allowlisted files above
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
